name: community-hylo-pilot
services:
  database:
    image: community-hylo-pilot-db:local
    build:
      context: ${HYLO_SOURCE:?Set HYLO_SOURCE in .env}
      dockerfile: ${HYLO_DB_DOCKERFILE:?Set HYLO_DB_DOCKERFILE in .env}
    environment:
      POSTGRES_USER: hylo
      POSTGRES_PASSWORD: ${HYLO_DB_PASSWORD:?Set HYLO_DB_PASSWORD in .env}
      POSTGRES_DB: hylo
    volumes:
      - hylo-db-v3:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hylo -d hylo && psql -U hylo -d hylo -c 'SELECT 1 FROM users LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: community-hylo-pilot:local
    build:
      context: ${HYLO_SOURCE:?Set HYLO_SOURCE in .env}
      dockerfile: ${HYLO_DOCKERFILE:?Set HYLO_DOCKERFILE in .env}
    working_dir: /opt/hylo/apps/backend
    command: ["node", "app.js"]
    environment:
      NODE_ENV: development
      PORT: 3001
      DOMAIN: localhost:3330
      PROTOCOL: http
      DATABASE_URL: postgres://hylo:${HYLO_DB_PASSWORD}@database:5432/hylo
      REDIS_URL: redis://redis:6379
      COOKIE_NAME: community-hylo-pilot
      COOKIE_SECRET: ${HYLO_COOKIE_SECRET:?Set HYLO_COOKIE_SECRET in .env}
      JWT_SECRET: ${HYLO_JWT_SECRET:?Set HYLO_JWT_SECRET in .env}
      OIDC_KEYS: ${HYLO_OIDC_KEY:?Set HYLO_OIDC_KEY in .env}
      EMAIL_NOTIFICATIONS_ENABLED: 'false'
      PUSH_NOTIFICATIONS_ENABLED: 'false'
      SENTRY_DSN: ''
      DISABLE_SEGMENT: '1'
      CORS_ALLOWED_ORIGINS: http://localhost:3330
      # Upstream imports these clients at startup. These are deliberately invalid;
      # no external login or payment capability is configured for the pilot.
      STRIPE_SECRET_KEY: sk_test_not_a_real_key
      ADMIN_GOOGLE_CLIENT_ID: local-pilot-invalid
      ADMIN_GOOGLE_CLIENT_SECRET: local-pilot-invalid
      GOOGLE_CLIENT_ID: local-pilot-invalid
      GOOGLE_CLIENT_SECRET: local-pilot-invalid
      LINKEDIN_API_KEY: local-pilot-invalid
      LINKEDIN_API_SECRET: local-pilot-invalid
      FACEBOOK_APP_ID: local-pilot-invalid
      FACEBOOK_APP_SECRET: local-pilot-invalid
      FACEBOOK_CLIENT_TOKEN: local-pilot-invalid
    ports:
      - '127.0.0.1:3101:3001'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    image: community-hylo-pilot:local
    working_dir: /opt/hylo/apps/web
    command:
      - sh
      - -c
      - >-
        sed -i 's/const proxyTarget = process.env.VITE_API_HOST ||/const proxyTarget = process.env.INTERNAL_API_HOST || process.env.VITE_API_HOST ||/' vite.config.js;
        sed -i 's/changeOrigin: true/changeOrigin: false/g' vite.config.js;
        sed -i "/'\/noo': {/i\\      '/.well-known': { target: proxyTarget, changeOrigin: false }," vite.config.js;
        exec yarn viteDev --host 0.0.0.0 --port 3000 --strictPort
    environment:
      NODE_ENV: development
      INTERNAL_API_HOST: http://backend:3001
      VITE_API_HOST: http://localhost:3101
      VITE_SOCKET_HOST: http://localhost:3101
      VITE_FILESTACK_API_KEY: ''
      VITE_MAPBOX_TOKEN: ''
      VITE_MIXPANEL_TOKEN: ''
      VITE_INTERCOM_APP_ID: ''
    ports:
      - '127.0.0.1:3330:3000'
    depends_on:
      - backend
volumes:
  hylo-db-v3:
